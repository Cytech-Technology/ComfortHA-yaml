name: "Cytech AI Assistant"
description: "Read-only AI assistant for Comfort questions and troubleshooting"
version: "0.1.1"
slug: "cytech_ai_assistant"
init: false
startup: application

ingress: true
ingress_port: 8099
panel_title: "AI Assistant"
panel_icon: "mdi:robot-happy-outline"
panel_admin: false
# Supervisor 2026.11+ treats the sidebar entry as a user setting (the
# "Show in sidebar" toggle in the App page) and ignores this key; older
# Supervisors use it to add the panel automatically.
ingress_panel: true

homeassistant_api: true

arch:
  - aarch64
  - amd64

url: "https://github.com/Cytech-Technology/ComfortHA-yaml/tree/main/cytech_ai_assistant"

options:
  proxy_url: "https://ai.cytech.biz"
  installation_token: ""
  model: "claude-sonnet-5-5"

schema:
  proxy_url: url
  installation_token: password?
  model: list(claude-sonnet-5-5|claude-haiku-4-5)
